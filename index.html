<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay 50 Birr</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 22px; color: #0f172a; }
    .sub { margin: 0 0 28px; color: #64748b; font-size: 14px; }
    .amount {
      font-size: 46px;
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .amount small { font-size: 20px; font-weight: 600; }
    .label { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #0f766e;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover:not(:disabled) { background: #115e59; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
      color: #64748b;
    }
    .status.error { color: #dc2626; }
    .secure {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Complete your payment</h1>
    <p class="sub">Secure checkout</p>

    <div class="amount">50 <small>ETB</small></div>
    <div class="label">Total amount due</div>

    <button id="payBtn">Pay 50 Birr</button>
    <div class="status" id="status"></div>

    <div class="secure">🔒 Secured by encrypted payment gateway</div>
  </div>

  <script>
    // server.js
require('dotenv').config();
const express = require('express');
const cors = require('cors');
const fetch = require('node-fetch'); // Use 'npm install node-fetch@2' if on Node < 18
const path = require('path');

const app = express();
app.use(cors());
app.use(express.json());

// Serve your index.html file from the "public" folder
app.use(express.static(path.join(__dirname, 'public')));

// Your API Key (NEVER expose this in the frontend HTML!)
// Create a .env file and put: PAYMENT_SECRET_KEY=sk_test_ACI_toUmxsLB-VR2-htStyQfxvUUYhKY
const SECRET_KEY = process.env.PAYMENT_SECRET_KEY || 'sk_test_ACI_toUmxsLB-VR2-htStyQfxvUUYhKY';

app.post('/api/pay', async (req, res) => {
  try {
    const { amount, currency } = req.body;

    // 1. Replace this URL with your actual payment gateway's API endpoint.
    // (Example: Chapa, Telebirr, Stripe, etc.)
    const GATEWAY_API_URL = 'https://api.yourpaymentgateway.com/v1/checkout'; 

    // 2. Make the request to the payment gateway
    // NOTE: This is a mock response for demonstration since the exact gateway wasn't specified.
    // In a real app, you would uncomment the fetch request below and adjust the body/headers.
    
    /*
    const response = await fetch(GATEWAY_API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${SECRET_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        amount: amount * 100, // Often gateways expect cents/centimes
        currency: currency,
        callback_url: 'http://localhost:3000/success'
      })
    });
    const data = await response.json();
    */

    // --- MOCK SUCCESS RESPONSE (Remove this when you have the real API) ---
    const data = {
      checkout_url: 'https://example.com/mock-checkout-page' 
    };
    // ----------------------------------------------------------------------

    res.json(data);

  } catch (error) {
    console.error('Payment error:', error);
    res.status(500).json({ error: { message: 'Payment processing failed.' } });
  }
});

const PORT = process.env.PORT || 3000;
app.listen(PORT, () => console.log(`Server running on http://localhost:${PORT}`));
  </script>
</body>
</html>
