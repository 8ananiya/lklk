<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay 50 Birr</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 22px; color: #0f172a; }
    .sub { margin: 0 0 28px; color: #64748b; font-size: 14px; }
    .amount {
      font-size: 46px;
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .amount small { font-size: 20px; font-weight: 600; }
    .label { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #0f766e;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover:not(:disabled) { background: #115e59; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
      color: #64748b;
    }
    .status.error { color: #dc2626; }
    .secure {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Complete your payment</h1>
    <p class="sub">Secure checkout</p>

    <div class="amount">50 <small>ETB</small></div>
    <div class="label">Total amount due</div>

    <button id="payBtn">Pay 50 Birr</button>
    <div class="status" id="status"></div>

    <div class="secure">🔒 Secured by encrypted payment gateway</div>
  </div>

  <script>
    const payBtn = document.getElementById('payBtn');
    const statusEl = document.getElementById('status');

    // ⚠️ IMPORTANT: REPLACE THIS WITH YOUR DEPLOYED BACKEND URL
    // Do NOT use /api/pay because GitHub Pages cannot run backend code.
    const API_URL = 'https://your-backend-server-url.com/api/pay'; 

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
    }

    payBtn.addEventListener('click', async () => {
      payBtn.disabled = true;
      payBtn.textContent = 'Processing…';
      setStatus('Creating your payment…');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: 50, currency: 'ETB' })
        });

        // Check if the server returned HTML instead of JSON (prevents "Unexpected token '<'" error)
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          throw new Error(`Server error (${res.status}). Ensure your backend URL is correct and the server is running.`);
        }

        const data = await res.json();

        if (!res.ok || !data.checkout_url) {
          throw new Error(data.error?.message || data.message || 'Could not start payment.');
        }

        setStatus('Redirecting to secure checkout…');
        window.location.href = data.checkout_url;

      } catch (err) {
        setStatus(err.message || 'Something went wrong.', true);
        payBtn.disabled = false;
        payBtn.textContent = 'Pay 50 Birr';
      }
    });
  </script>
</body>
</html>
